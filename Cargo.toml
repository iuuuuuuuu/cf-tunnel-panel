[package]
name = "cf-tunnel-panel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Cloudflare Tunnel 面板：Web UI + 系统托盘 + 服务端"

[lib]
name = "cf_tunnel_panel"
path = "src/lib.rs"

[[bin]]
name = "cf-tunnel-panel"
path = "src/bin/tray.rs"
required-features = ["tray"]

[[bin]]
name = "cf-tunnel-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:muda", "dep:windows-sys"]
server = ["dep:tiny_http", "dep:argon2", "dep:rand"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }
tiny_http = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
tray-icon = { version = "0.25", optional = true }
muda = { version = "0.20", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
